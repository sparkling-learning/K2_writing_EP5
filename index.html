<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>運筆遊戲:捺(滑滑梯)</title>
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; overflow: hidden; font-family: sans-serif; }
        
        /* 鎖定黃金比例 (1414x2000)，無論 iPad 橫向定直向，都完美置中且絕不移位 */
        #game-container { 
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (1414 / 2000));
            max-height: calc(100vw * (2000 / 1414));
            aspect-ratio: 1414 / 2000;
            background-color: #fff;
            overflow: hidden;
            touch-action: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        #bg { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: fill; pointer-events: none; 
        }

        /* 滑梯圖 (12.png) 位於草地上，並向左傾斜 rotate(-5deg) */
        #slide { 
            position: absolute; width: 55%; left: 22.5%; bottom: -2%; 
            object-fit: contain; pointer-events: none;
            transform: rotate(-5deg);
            transform-origin: center center;
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #stars-container { position: absolute; top: 20px; left: 20px; font-size: 36px; color: #ddd; z-index: 10; text-shadow: 2px 2px 0 #333; }
        .star-active { color: #FFD700; }

        /* 終點黃色閃爍光圈 */
        #target-glow { 
            position: absolute; width: 55px; height: 55px; border-radius: 50%; 
            background: rgba(255, 215, 0, 0.5); border: 4px solid #FFD700; 
            transform: translate(-50%, -50%); animation: pulse 1s infinite alternate; z-index: 5; 
        }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
        
        /* 小朋友圖基本設定（尺寸由 JavaScript 根據角色動態調整） */
        #player { 
            position: absolute; transform: translate(-50%, -50%); 
            cursor: grab; z-index: 20; touch-action: none; object-fit: contain;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.25));
        }

        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.5s; }
        #overlay.show { opacity: 1; pointer-events: auto; }
        #message { font-size: 60px; color: #FF5722; font-weight: bold; text-shadow: 3px 3px 0px #FFC107; }
        #btn-replay { margin-top: 40px; padding: 15px 40px; font-size: 30px; font-weight: bold; background-color: #4CAF50; color: white; border: none; border-radius: 50px; cursor: pointer; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div id="game-container">
    <img id="bg" src="11.png" alt="背景">
    <img id="slide" src="12.png" alt="滑梯">
    <canvas id="guide-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
    <div id="stars-container">★ ★ ★ ★ ★</div>
    <div id="target-glow"></div>
    <img id="player" src="boy.png" alt="小朋友" draggable="false">
    <div id="overlay">
        <div id="message">✨ 你真努力！</div>
        <button id="btn-replay">再玩一次</button>
    </div>
</div>

<script>
    // 透過數學旋轉公式將運筆路徑整體向左傾斜 5 度
    const angle = -5 * Math.PI / 180;
    const cx = 0.50;
    const cy = 0.705;

    function rotNorm(x, y) {
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        return {
            x: cx + (x - cx) * cos - (y - cy) * sin,
            y: cy + (x - cx) * sin + (y - cy) * cos
        };
    }

    // 頁一、三、五 (boy.png)：左邊起點向右移2% (0.37 + 0.02 = 0.39) -> { x: 0.39, y: 0.64 }
    // 頁二、四 (girl.png)：位置下移4% (0.64 + 0.04 = 0.68) -> { x: 0.43, y: 0.68 }
    const baseStarts = [
        { x: 0.39, y: 0.64 }, // 頁一 (Boy) - 右移2%
        { x: 0.43, y: 0.68 }, // 頁二 (Girl) - 下移4%
        { x: 0.39, y: 0.64 }, // 頁三 (Boy) - 右移2%
        { x: 0.43, y: 0.68 }, // 頁四 (Girl) - 下移4%
        { x: 0.39, y: 0.64 }  // 頁五 (Boy) - 右移2%
    ];

    const pStarts = baseStarts.map(pos => rotNorm(pos.x, pos.y));
    
    // 中間點維持不變
    const baseCtrls = [
        { x: 0.47, y: 0.79 }, // 頁一 (Boy)
        { x: 0.48, y: 0.78 }, // 頁二 (Girl)
        { x: 0.47, y: 0.79 }, // 頁三 (Boy)
        { x: 0.48, y: 0.78 }, // 頁四 (Girl)
        { x: 0.47, y: 0.79 }  // 頁五 (Boy)
    ];

    const pCtrls = baseCtrls.map(pos => rotNorm(pos.x, pos.y));
    const baseEnd = { x: 0.65, y: 0.86 };
    const pEnd = rotNorm(baseEnd.x, baseEnd.y);

    const config = {
        levels: ['boy.png', 'girl.png', 'boy.png', 'girl.png', 'boy.png'],
        hitRadius: 45,
        allowedDeviation: 32 
    };

    let currentLevel = 0, isDragging = false, starsEarned = 0;
    const container = document.getElementById('game-container');
    const guideCanvas = document.getElementById('guide-canvas'), drawCanvas = document.getElementById('draw-canvas');
    const guideCtx = guideCanvas.getContext('2d'), drawCtx = drawCanvas.getContext('2d');
    const player = document.getElementById('player'), targetGlow = document.getElementById('target-glow');
    const overlay = document.getElementById('overlay'), replayBtn = document.getElementById('btn-replay'), starsContainer = document.getElementById('stars-container');

    let startPx = {x: 0, y: 0}, ctrlPx = {x: 0, y: 0}, endPx = {x: 0, y: 0};
    
    function updatePlayerSize() {
        if (config.levels[currentLevel] === 'girl.png') {
            player.style.width = '456px';
            player.style.height = '456px';
        } else {
            player.style.width = '380px';
            player.style.height = '380px';
        }
    }

    function updateLevelCoords(rect) {
        const curStart = pStarts[currentLevel];
        const curCtrl = pCtrls[currentLevel];
        startPx = { x: rect.width * curStart.x, y: rect.height * curStart.y };
        ctrlPx  = { x: rect.width * curCtrl.x,  y: rect.height * curCtrl.y };
        endPx   = { x: rect.width * pEnd.x,     y: rect.height * pEnd.y };
    }

    function resizeAndInit() {
        const rect = container.getBoundingClientRect();
        guideCanvas.width = rect.width; guideCanvas.height = rect.height;
        drawCanvas.width = rect.width; drawCanvas.height = rect.height;
        
        updateLevelCoords(rect);
        targetGlow.style.left = `${endPx.x}px`;
        targetGlow.style.top = `${endPx.y}px`;

        updatePlayerSize();
        drawGuidePath();
        resetPlayer();
    }

    function drawGuidePath() {
        guideCtx.clearRect(0, 0, guideCanvas.width, guideCanvas.height);
        guideCtx.beginPath();
        guideCtx.moveTo(startPx.x, startPx.y);
        guideCtx.quadraticCurveTo(ctrlPx.x, ctrlPx.y, endPx.x, endPx.y);
        guideCtx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        guideCtx.lineWidth = 42; 
        guideCtx.lineCap = 'round';
        guideCtx.stroke();
    }

    function loadLevel() {
        player.src = config.levels[currentLevel];
        updatePlayerSize();
        const rect = container.getBoundingClientRect();
        updateLevelCoords(rect);

        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        drawGuidePath();
        resetPlayer();
        overlay.classList.remove('show');
    }

    function resetPlayer() {
        player.style.left = `${startPx.x}px`;
        player.style.top = `${startPx.y}px`;
    }

    function updateStars() {
        starsContainer.innerHTML = Array(5).fill(0).map((_, i) => i < starsEarned ? '<span class="star-active">★</span> ' : '<span>★</span> ').join('');
    }

    function getDistanceFromCurve(px, py, p0, p1, p2) {
        let minDistSq = Infinity;
        for (let i = 0; i <= 50; i++) {
            let t = i / 50;
            let bx = Math.pow(1-t, 2) * p0.x + 2 * (1-t) * t * p1.x + Math.pow(t, 2) * p2.x;
            let by = Math.pow(1-t, 2) * p0.y + 2 * (1-t) * t * p1.y + Math.pow(t, 2) * p2.y;
            let distSq = Math.pow(px - bx, 2) + Math.pow(py - by, 2);
            if (distSq < minDistSq) minDistSq = distSq;
        }
        return Math.sqrt(minDistSq);
    }

    player.addEventListener('pointerdown', (e) => {
        isDragging = true;
        player.setPointerCapture(e.pointerId);
        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        drawCtx.beginPath();
        drawCtx.moveTo(startPx.x, startPx.y);
    });

    player.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const rect = container.getBoundingClientRect();
        let curX = e.clientX - rect.left, curY = e.clientY - rect.top;
        
        let deviation = getDistanceFromCurve(curX, curY, startPx, ctrlPx, endPx);
        if (deviation > config.allowedDeviation) {
            resetPlayer();
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawCtx.beginPath();
            drawCtx.moveTo(startPx.x, startPx.y);
            return;
        }

        player.style.left = `${curX}px`; 
        player.style.top = `${curY}px`;

        drawCtx.lineTo(curX, curY);
        drawCtx.strokeStyle = '#FF5722'; 
        drawCtx.lineWidth = 14; 
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.stroke();
        drawCtx.beginPath(); 
        drawCtx.moveTo(curX, curY);

        if (Math.hypot(endPx.x - curX, endPx.y - curY) < config.hitRadius) {
            winLevel();
        }
    });

    player.addEventListener('pointerup', () => {
        if (!isDragging) return;
        isDragging = false;
        
        const currentDist = Math.hypot(endPx.x - parseFloat(player.style.left), endPx.y - parseFloat(player.style.top));
        if (currentDist >= config.hitRadius) {
            resetPlayer();
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        }
    });

    function winLevel() {
        isDragging = false;
        if(starsEarned < currentLevel + 1) starsEarned++;
        updateStars();
        overlay.classList.add('show');
        
        if (currentLevel < 4) {
            setTimeout(() => { currentLevel++; loadLevel(); }, 2000);
        } else {
            setTimeout(() => { replayBtn.style.display = 'block'; }, 1000);
        }
    }

    replayBtn.addEventListener('click', () => { location.reload(); });
    window.addEventListener('resize', resizeAndInit);
    window.onload = () => { resizeAndInit(); updateStars(); loadLevel(); };
</script>
</body>
</html>
